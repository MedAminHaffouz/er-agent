[project]
name = "er-agent"
version = "0.1.0"
description = "GL4 AI — Integrated Intelligent Agent for Emergency Management (educational simulation)"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "joblib",
  "torch",
  "matplotlib",
  "streamlit",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
real = ["openpyxl"]   # bonus: real KTAS data (er_agent.learning.real_data)

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["er_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
